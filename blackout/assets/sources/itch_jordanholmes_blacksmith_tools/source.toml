title     = "Free Blacksmith Tool Set - PBR Textures included"
author    = "JordanHolmes"
url       = "https://jordanholmes.itch.io/free-blacksmith-tool-set-pbr-textures-included"
site      = "itch.io"
license   = "LicenseRef-Unconfirmed"
exception = "The itch.io page states no license (checked 10/20/2026). It says the pack is free and game engine ready. Name-your-own-price is a price, not a grant. Ask the author, or replace the models, before a public release."
retrieved = 2026-10-20
notes     = "Blacksmith Tools.zip, unpacked by the fetch. One .blend, .fbx and .obj hold all twelve meshes at one origin, with one 2048 PBR texture set for each group. The materials of the .blend name no image, so each model record attaches the base colour of its group."

