notes     = "A PAID pack. Nick bought it on itch.io (Nick, 10/09/2026). The page names no license and states no terms of use (checked 10/09/2026). Four VoxEdit exports of one model, as they arrived: the glTF, the FBX, the .vox, and a zip of DAE files. The model record reads the glTF. Its rest pose is the first frame of its Idle animation. It holds about 130 animations (22 MB of its 38 MB), and the record drops them. The FBX is in a T-pose and names textures that only the zip holds. The page says that the model works with every VoxEdit animation."

