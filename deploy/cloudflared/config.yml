# Cloudflare Tunnel ingress for game.playblackout.io
#
# Copy to C:\ProgramData\cloudflared\config.yml and fill in the tunnel id.
# That single location serves BOTH the Windows service and manual runs -- see
# the README. Do NOT put the live config in the cloudflared install directory:
# cloudflared rewrites that file with a stub every time the service starts.
#
# The tunnel dials OUT from this machine, so no port forwarding is needed --
# which is the point, since this connection sits behind three NAT layers.
#
# Rules are evaluated top to bottom; the first match wins. The websocket rule
# MUST come before the catch-all or the browser client will be handed HTML.

tunnel: REPLACE-WITH-TUNNEL-ID
credentials-file: C:\ProgramData\cloudflared\REPLACE-WITH-TUNNEL-ID.json

ingress:
  # Webclient websocket. WEBSOCKET_CLIENT_URL in settings.py points here.
  # `path` is a Go regular expression, not a glob.
  - hostname: game.playblackout.io
    path: ^/ws
    service: ws://localhost:4002
    originRequest:
      # NOTE: these do NOT control the websocket idle disconnect. They govern
      # cloudflared's HTTP connection pool to the origin. Measured 08/21/2026
      # with keepAliveTimeout already at 1000s, silent websockets still died
      # at 125.6s / 126.0s / 126.9s -- because it is the Cloudflare EDGE that
      # closes websockets idle for ~100s, and that timer is not configurable
      # below Enterprise. The real fix is server-side: Evennia now pings every
      # 45s via WEBSOCKET_PROTOCOL_CLASS in blackout/server/conf/settings.py.
      # Kept because a longer-lived origin pool is still mildly useful.
      keepAliveTimeout: 1000s
      tcpKeepAlive: 90s

  # Everything else -- the Evennia webserver (WEBSERVER_PORTS proxy port).
  - hostname: game.playblackout.io
    service: http://localhost:4001

  # Required catch-all.
  - service: http_status:404

# Logging. The key is `log-directory` -- kebab-case, matching the CLI flag.
# `logDirectory` is NOT a recognised key. cloudflared ignores it silently and
# writes no logs at all, which is how the service stayed undiagnosable until
# 08/22/2026. Verify after any change: a cloudflared-*.log must appear here.
log-directory: C:\ProgramData\cloudflared
